name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Windows because the app is tkinter on Windows, and the window tests open a
    # real Tk window. The two Pythons are the ends of the supported range.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        # No browser is installed and none is needed: nothing here touches the portal.
        run: python -m pytest
